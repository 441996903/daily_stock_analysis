name: turnover-pool

on:
  push:
    branches: [turnover-pool]
    paths:
      - 'turnover-pool/**'
      - '.github/workflows/turnover-pool.yml'

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute turnover pool
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          set -o pipefail
          python turnover-pool/compute_pool.py 2>&1 | tee turnover-pool/run.log
      - name: Commit results back to branch
        if: always()
        run: |
          git config user.name "turnover-pool"
          git config user.email "actions@users.noreply.github.com"
          git add turnover-pool/
          git commit -m "turnover pool run results" || echo "nothing to commit"
          git push
